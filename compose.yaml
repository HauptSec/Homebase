name: homebase
services:
  api:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8092:8080"
    volumes:
      - homebase-data:/data
      - homebase-backups:/backups
      - ./releases:/releases:ro
      - ./secrets/apns.p8:/run/secrets/apns.p8:ro
    env_file:
      - path: .env
        required: false
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    cpus: 1.0
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"]
      interval: 20s
      timeout: 6s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  tunnel:
    image: cloudflare/cloudflared:2026.10.7
    profiles: [tunnel]
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token-file /run/secrets/cloudflare-tunnel-token
    volumes:
      - ./secrets/cloudflare-tunnel-token:/run/secrets/cloudflare-tunnel-token:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      api:
        condition: service_healthy
volumes:
  homebase-data:
  homebase-backups:
