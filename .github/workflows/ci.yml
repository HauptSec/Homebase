name: Verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r server/requirements.txt
      - run: python -m unittest discover -s server/tests -v
      - run: docker compose config --quiet
      - name: Build with restrictive checkout permissions
        run: |
          chmod -R go-rwx server
          docker build -t homebase:test .
      - name: Verify unprivileged container startup
        run: |
          docker run -d --name homebase-smoke --read-only --tmpfs /tmp --tmpfs /data:uid=10001,gid=10001 --cap-drop ALL -p 127.0.0.1:8092:8080 homebase:test
          curl --fail --max-time 5 --retry 12 --retry-all-errors --retry-delay 2 http://127.0.0.1:8092/health
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:8092/v1/sync)" = 401
      - name: Container diagnostics
        if: always()
        run: docker logs homebase-smoke || true
  ios:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Verify US holiday dates
        run: |
          swiftc ios/Homebase/Models.swift ios/Homebase/Holidays.swift ios/Tests/HolidaysTests.swift -o /tmp/homebase-holiday-tests
          /tmp/homebase-holiday-tests
      - name: Verify budget compatibility and recurrence
        run: |
          swiftc ios/Homebase/Models.swift ios/Tests/BudgetTests.swift -o /tmp/homebase-budget-tests
          /tmp/homebase-budget-tests
      - name: Verify home dinner expiry
        run: |
          swiftc ios/Homebase/Models.swift ios/Tests/HomeTests.swift -o /tmp/homebase-home-tests
          /tmp/homebase-home-tests
      - name: Verify recurring events and native calendar fields
        run: |
          swiftc ios/Homebase/Models.swift ios/Homebase/EventRecurrence.swift ios/Homebase/CalendarEventFields.swift ios/Tests/RecurrenceTests.swift -o /tmp/homebase-recurrence-tests
          /tmp/homebase-recurrence-tests
      - run: xcodebuild -project ios/Homebase.xcodeproj -scheme Homebase -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
